info:
  name: Activate
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{BASE_URL}}/banks/:id/activate"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/banks/:id/activate"
      method: PATCH
      params:
        - name: id
          value: "1"
          type: path
      body:
        type: json
        data: ""
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Wed, 25 Feb 2026 04:46:17 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "177"
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Bank activated successfully",
              "data": {
                  "bank_id": 1,
                  "bank_name": "Bank Central Asia (BCA)",
                  "is_active": true,
                  "updated_at": "2026-02-25T11:46:17+07:00"
              }
          }
  - name: Err not found
    request:
      url: "{{BASE_URL}}/banks/:id/activate"
      method: PATCH
      params:
        - name: id
          value: "99"
          type: path
      body:
        type: json
        data: ""
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Date
          value: Wed, 25 Feb 2026 04:46:30 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "45"
      body:
        type: json
        data: |-
          {
              "status": "error",
              "message": "bank not found"
          }
