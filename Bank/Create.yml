info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/banks"
  body:
    type: json
    data: "{\r

      \    \"bank_name\": \"Bank Central Asia\",\r

      \    \"bi_code\": \"014\"\r

      }"
  auth:
    type: bearer
    token: "{{xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/banks"
      method: POST
      body:
        type: json
        data: "{\r

          \    \"bank_name\": \"Bank Central Asia\",\r

          \    \"bi_code\": \"014\"\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Wed, 25 Feb 2026 04:15:20 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "238"
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Bank created successfully",
              "data": {
                  "bank_id": 1,
                  "bank_name": "Bank Central Asia",
                  "bi_code": "014",
                  "is_active": true,
                  "user_create": "077540ce-58d2-41b8-a0b4-1b49613be62f",
                  "created_at": "2026-02-25T11:15:20+07:00"
              }
          }
  - name: Err duplicate bi code
    request:
      url: "{{BASE_URL}}/banks"
      method: POST
      body:
        type: json
        data: "{\r

          \    \"bank_name\": \"Bank Central Asia\",\r

          \    \"bi_code\": \"014\"\r

          }"
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Date
          value: Wed, 25 Feb 2026 04:15:39 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "69"
      body:
        type: json
        data: |-
          {
              "status": "error",
              "message": "bank with bi code '014' already exists"
          }
  - name: Err duplicate bank name
    request:
      url: "{{BASE_URL}}/banks"
      method: POST
      body:
        type: json
        data: "{\r

          \    \"bank_name\": \"Bank Central Asia\",\r

          \    \"bi_code\": \"999\"\r

          }"
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Date
          value: Wed, 25 Feb 2026 04:15:53 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "80"
      body:
        type: json
        data: |-
          {
              "status": "error",
              "message": "bank with name 'Bank Central Asia' already exists"
          }
