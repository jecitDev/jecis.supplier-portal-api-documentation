info:
  name: Get By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/banks/:bank_id"
  params:
    - name: bank_id
      value: "1"
      type: path
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/banks/:bank_id"
      method: GET
      params:
        - name: bank_id
          value: "1"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Wed, 25 Feb 2026 04:30:04 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "277"
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Bank retrieved successfully",
              "data": {
                  "bank_id": 1,
                  "bank_name": "Bank Central Asia",
                  "bi_code": "014",
                  "is_active": true,
                  "user_create": "077540ce-58d2-41b8-a0b4-1b49613be62f",
                  "created_at": "2026-02-25T11:15:20+07:00",
                  "user_update": null,
                  "updated_at": null
              }
          }
  - name: Err not found
    request:
      url: "{{BASE_URL}}/banks/:bank_id"
      method: GET
      params:
        - name: bank_id
          value: "99"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Date
          value: Wed, 25 Feb 2026 04:30:15 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "45"
      body:
        type: json
        data: |-
          {
              "status": "error",
              "message": "bank not found"
          }
  - name: Err invalid request
    request:
      url: "{{BASE_URL}}/banks/:bank_id"
      method: GET
      params:
        - name: bank_id
          value: error
          type: path
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Date
          value: Wed, 25 Feb 2026 04:30:24 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "46"
      body:
        type: json
        data: |-
          {
              "status": "error",
              "message": "Invalid bank ID"
          }
