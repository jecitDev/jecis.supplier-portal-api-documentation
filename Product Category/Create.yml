examples:
  - name: Success
    request:
      url: "{{BASE_URL}}/product-categories"
      method: POST
      body:
        type: json
        data: "{\r

          \    \"name\": \"Medical Equipment\",\r

          \    \"code\": \"MED-EQ\",\r

          \    \"is_active\": true\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: Date
          value: Tue, 24 Feb 2026 13:53:39 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "314"
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Product category created successfully",
              "data": {
                  "id": "b2327fbd-f857-41e2-9aea-0d33445b6728",
                  "name": "Medical Equipment",
                  "code": "MED-EQ",
                  "is_active": true,
                  "user_create": "077540ce-58d2-41b8-a0b4-1b49613be62f",
                  "created_at": "2026-02-24T20:53:39+07:00",
                  "user_update": null,
                  "updated_at": null
              }
          }
  - name: Err missing field
    request:
      url: "{{BASE_URL}}/product-categories"
      method: POST
      body:
        type: json
        data: "{\r

          \    // \"name\": \"Medical Equipment\",\r

          \    \"code\": \"MED-EQ\",\r

          \    \"is_active\": true\r

          }"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Date
          value: Tue, 24 Feb 2026 13:54:22 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "47"
      body:
        type: json
        data: |-
          {
              "status": "error",
              "message": "name is required"
          }
  - name: Err duplicate name
    request:
      url: "{{BASE_URL}}/product-categories"
      method: POST
      body:
        type: json
        data: "{\r

          \    \"name\": \"Medical Equipment\",\r

          \    \"code\": \"MED-EQ\",\r

          \    \"is_active\": true\r

          }"
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Date
          value: Tue, 24 Feb 2026 13:54:57 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "92"
      body:
        type: json
        data: |-
          {
              "status": "error",
              "message": "product category with name 'Medical Equipment' already exists"
          }
  - name: Err duplicate code
    request:
      url: "{{BASE_URL}}/product-categories"
      method: POST
      body:
        type: json
        data: "{\r

          \    \"name\": \"Medical Equipment New\",\r

          \    \"code\": \"MED-EQ\",\r

          \    \"is_active\": true\r

          }"
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Date
          value: Tue, 24 Feb 2026 13:55:23 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "81"
      body:
        type: json
        data: |-
          {
              "status": "error",
              "message": "product category with code 'MED-EQ' already exists"
          }
