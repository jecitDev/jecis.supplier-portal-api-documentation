info:
  name: Get All Supplier
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/suppliers?page=1&page_size=10&keyword=medika&include=addresses,contacts,assessments,documents&sort_by=company_name&sort_order=asc"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
    - name: status
      value: approved
      type: query
      disabled: true
    - name: keyword
      value: medika
      type: query
    - name: include
      value: addresses,contacts,assessments,documents
      type: query
    - name: sort_by
      value: company_name
      type: query
    - name: sort_order
      value: asc
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

