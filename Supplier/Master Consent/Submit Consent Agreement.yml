info:
  name: Submit Consent Agreement
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/suppliers/master-consents/:master_consent_id/agree"
  params:
    - name: master_consent_id
      value: d1cf6bc5-5f35-4cc8-9a61-565846e272dc
      type: path
  body:
    type: json
    data: "{\r

      \    \"submitted_data\": {\r

      \        \"company_name\": \"PT Maju Bersama\",\r

      \        \"agree_terms\": true\r

      \    }\r

      }"
  auth:
    type: bearer
    token: "{{xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

