    request:
      url: "{{BASE_URL}}/suppliers/master-consents/:master_consent_id/agree"
      method: POST
      params:
        - name: master_consent_id
          value: d1cf6bc5-5f35-4cc8-9a61-565846e272dc
          type: path
      body:
        type: json
        data: "{\r

          \    \"submitted_data\": {\r

          \        \"company_name\": \"PT Maju Bersama\",\r

          \        \"agree_terms\": true\r

          \    }\r

          }"
    response:
      status: 201
      statusText: Created
      headers:
        - name: date
          value: Thu, 22 Oct 2026 02:57:37 GMT
        - name: content-type
          value: application/json
        - name: content-length
          value: "479"
      body:
