info:
  name: Get Supplier Documents
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/suppliers/master-consents/active?document_code=NDA"
  params:
    - name: document_code
      value: NDA
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
