info:
  name: Generate Temporary Token
  type: http
  seq: 11

http:
  method: POST
  url: "{{BASE_URL}}/auth/temporary-token"
  body:
    type: json
    data: "{\r

      \    \"email\": \"justki7o.26@gmail.com\",\r

      \    \"allowed_endpoints\": [\"/supplier*\", \"/item*\"],\r

      \    \"expires_in_hours\": 24\r

      }"
