info:
  name: Get Dashboard Summary (Admin)
  type: http
  seq: 14

http:
  method: GET
  url: "{{base_url}}/dashboard/summary"
  auth:
    type: bearer
    token: "{{xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Fetches the dashboard metrics for an admin user (global data assuming the auth token corresponds to an admin role).
