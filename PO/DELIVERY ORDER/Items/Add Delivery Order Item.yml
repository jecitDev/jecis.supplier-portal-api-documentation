info:
  name: Add Delivery Order Item
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/delivery-orders/:id/items"
  params:
    - name: id
      value: 8ea9ec4c-ab71-4f97-8d2d-bf383b21db0e
      type: path
  body:
    type: json
    data: "{\r

      \    \"item_id\": \"1200001252\",\r

      \    \"item_name\": \"PARACETAMOL 8 MG\",\r

      \    \"quantity\": 30,\r

      \    \"uom\": \"TABLET\"\r

      }"
  auth:
    type: bearer
    token: "{{xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

