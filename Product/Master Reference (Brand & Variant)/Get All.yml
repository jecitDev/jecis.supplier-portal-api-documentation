info:
  name: Get All
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/master-references?page=1&page_size=10&keyword=Essilor&is_active=true&sort_by=name&sort_order=asc"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
    - name: keyword
      value: Essilor
      type: query
    - name: reference_type
      value: product_variant
      type: query
      disabled: true
    - name: is_active
      value: "true"
      type: query
    - name: sort_by
      value: name
      type: query
    - name: sort_order
      value: asc
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
