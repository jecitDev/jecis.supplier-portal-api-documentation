info:
  name: Get By ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/settings/:id"
  params:
    - name: id
      value: legal_team_email
      type: path
  body:
    type: json
    data: "{\r

      \    \"id\": \"legal_team_email\",\r

      \    \"name\": \"Legal Team Email\",\r

      \    \"value\": \"legal@company.com\",\r

      \    \"is_active\": true\r

      }"
  auth:
    type: bearer
    token: "{{x-refresh-token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Success
    request:
      url: http://localhost:8081/settings/:id
      method: GET
      params:
        - name: id
          value: legal_team_email
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Date
          value: Mon, 23 Feb 2026 05:36:57 GMT
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "293"
      body:
        type: json
        data: |-
          {
              "status": "success",
              "message": "Setting retrieved successfully",
              "data": {
                  "ID": "legal_team_email",
                  "Name": "Legal Team Email",
                  "Value": "legal@company.com",
                  "IsActive": true,
                  "UserCreate": "077540ce-58d2-41b8-a0b4-1b49613be62f",
                  "CreatedAt": "2026-02-23T12:31:46+07:00",
                  "UserUpdate": null,
                  "UpdatedAt": null
              }
          }
  - name: Err not found
    request:
      url: http://localhost:8081/settings/:id
      method: GET
      params:
        - name: id
          value: test
          type: path
