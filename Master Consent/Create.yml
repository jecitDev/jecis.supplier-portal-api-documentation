info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/admin/master-consents"
  body:
    type: json
    data: "{\r

      \    \"document_code\": \"NDA\",\r

      \    \"version\": \"1.0\",\r

      \    \"title\": \"Non-Disclosure Agreement v1.0\",\r

      \    \"html_content\": \"<p>Dengan ini <b><input type='text' name='company_name'></b> menyetujui...</p><br><input type='checkbox' name='agree_terms'> Saya Setuju\",\r

      \    \"input_schema\": {\r

      \        \"company_name\": \"string\",\r

      \        \"agree_terms\": \"boolean\"\r

      \    }\r

      }"
  auth:
    type: bearer
    token: "{{xtoken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

